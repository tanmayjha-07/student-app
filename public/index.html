<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #123d6a;
            color: white;
            padding: 24px 20px;
        }

        main {
            width: min(1100px, calc(100% - 32px));
            margin: 24px auto;
        }

        h1,
        h2 {
            margin: 0;
        }

        h1 {
            font-size: 28px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        .panel {
            background: white;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(5, minmax(120px, 1fr));
            gap: 12px;
            align-items: end;
        }

        label {
            display: grid;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #b9c5d6;
            border-radius: 6px;
            font: inherit;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 11px 14px;
            background: #1769aa;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #0f527f;
        }

        button.delete {
            background: #b42318;
        }

        button.delete:hover {
            background: #8f1b13;
        }

        button.secondary {
            background: #426075;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border-bottom: 1px solid #e2e8f0;
            padding: 12px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #eef3f8;
            font-size: 13px;
        }

        td input {
            max-width: 90px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .message {
            min-height: 24px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .error {
            color: #b42318;
        }

        .success {
            color: #0f6b3f;
        }

        @media (max-width: 820px) {
            form {
                grid-template-columns: 1fr;
            }

            table,
            thead,
            tbody,
            th,
            td,
            tr {
                display: block;
            }

            thead {
                display: none;
            }

            tr {
                border: 1px solid #dbe3ef;
                border-radius: 8px;
                padding: 10px;
                margin-bottom: 12px;
            }

            td {
                border: 0;
                display: grid;
                grid-template-columns: 110px 1fr;
                gap: 10px;
                padding: 8px 0;
            }

            td::before {
                content: attr(data-label);
                font-weight: 700;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Student Record Management System</h1>
    </header>

    <main>
        <section class="panel">
            <h2>Add Student</h2>
            <div id="message" class="message"></div>
            <form id="studentForm">
                <label>
                    Name
                    <input id="name" name="name" required>
                </label>
                <label>
                    Roll Number
                    <input id="rollNumber" name="rollNumber" required>
                </label>
                <label>
                    Branch
                    <input id="branch" name="branch">
                </label>
                <label>
                    Marks
                    <input id="marks" name="marks" type="number" min="0" max="100">
                </label>
                <button type="submit">Add Student</button>
            </form>
        </section>

        <section class="panel">
            <h2>All Students</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Branch</th>
                        <th>Marks</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsBody"></tbody>
            </table>
        </section>
    </main>

    <script>
        const form = document.getElementById('studentForm');
        const message = document.getElementById('message');
        const studentsBody = document.getElementById('studentsBody');

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        async function requestJson(url, options) {
            const response = await fetch(url, options);
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(data.message || 'Request failed');
            }

            return data;
        }

        async function loadStudents() {
            try {
                const students = await requestJson('/api/students');
                studentsBody.innerHTML = '';

                if (students.length === 0) {
                    studentsBody.innerHTML = '<tr><td data-label="Students" colspan="5">No students found.</td></tr>';
                    return;
                }

                students.forEach((student) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td data-label="Name">${student.name}</td>
                        <td data-label="Roll Number">${student.rollNumber}</td>
                        <td data-label="Branch">${student.branch || ''}</td>
                        <td data-label="Marks">
                            <input type="number" min="0" max="100" value="${student.marks ?? ''}" aria-label="Marks for ${student.name}">
                        </td>
                        <td data-label="Actions">
                            <div class="actions">
                                <button class="secondary" type="button">Update Marks</button>
                                <button class="delete" type="button">Delete</button>
                            </div>
                        </td>
                    `;

                    row.querySelector('.secondary').addEventListener('click', async () => {
                        const marks = row.querySelector('input').value;
                        await updateMarks(student._id, marks);
                    });

                    row.querySelector('.delete').addEventListener('click', async () => {
                        await deleteStudent(student._id);
                    });

                    studentsBody.appendChild(row);
                });
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        async function addStudent(event) {
            event.preventDefault();

            const student = {
                name: form.name.value.trim(),
                rollNumber: form.rollNumber.value.trim(),
                branch: form.branch.value.trim(),
                marks: form.marks.value === '' ? undefined : Number(form.marks.value)
            };

            try {
                await requestJson('/api/students', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(student)
                });
                form.reset();
                alert('Student added successfully.');
                await loadStudents();
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        async function updateMarks(id, marks) {
            try {
                await requestJson(`/api/students/${id}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({marks: marks === '' ? undefined : Number(marks)})
                });
                alert('Marks updated successfully.');
                await loadStudents();
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        async function deleteStudent(id) {
            try {
                await requestJson(`/api/students/${id}`, {method: 'DELETE'});
                alert('Student deleted successfully.');
                await loadStudents();
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        form.addEventListener('submit', addStudent);
        loadStudents();
    </script>
</body>
</html>
